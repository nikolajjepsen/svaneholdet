services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: svaneholdet
      POSTGRES_USER: svaneholdet
      POSTGRES_PASSWORD: svaneholdet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "svaneholdet"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:2525:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
